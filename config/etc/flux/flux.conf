local_repo_path = /var/lib/flux/recipes
remote_repo_url = https://github.com/shinigami-os/flux-recipes
binary_cache_url = https://cache.kira-linux.com
default_build_flags = -O2 -pipe -march=x86-64-v2
flux_pub_path = /etc/flux/flux.pub
flux_secret_key_path = 
cross_compile_prefix = x86_64-linux-musl-
cross_compile_sysroot = /opt/musl-cross/x86_64-linux-musl
cross_toolchain_path = /opt/musl-cross/bin
package_target = x86_64-linux-musl
# edge rebuilds continuously and occasionally ships two interdependent packages
# (e.g. mariadb-dev and mariadb-connector-c-dev) a release apart from each other -
# latest-stable is a real path on Alpine's own CDN, not a fixed version number,
# so this keeps tracking whatever Alpine's current stable release is without
# ever needing to be bumped by hand
alpine_mirror_url = https://dl-cdn.alpinelinux.org/alpine
alpine_branch = latest-stable